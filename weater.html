<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창원시 양덕동 대형 실시간 날씨 (TV용)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #1e375a, #2980b9); 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* 스크롤바 절대 방지 */
        }
        
        .weather-container {
            background: rgba(255, 255, 255, 0.98);
            padding: 20px 40px; /* 위아래 여백을 줄여 잘림 방지 */
            border-radius: 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 95%; /* 기존 92% -> 95%로 더 넓게 활용 */
            height: 90vh; /* 기존 80% -> 90%로 세로 여백을 확 줄임 */
            box-sizing: border-box;
        }

        .current-weather {
            flex: 1.3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-right: 3px solid #e2e8f0;
            padding-right: 40px;
            height: 100%;
        }

        .location-title {
            margin: 0 0 10px 0;
            color: #1e375a;
            font-size: 4rem; /* 더 크게 키움 */
            font-weight: bold;
            white-space: nowrap;
        }

        .weather-icon-box {
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .weather-icon-box img {
            width: 280px; /* 초대형 크기 확대 */
            height: 280px;
            filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.2));
        }

        .update-info {
            font-size: 2rem; /* 시간 크기 확대 */
            color: #7f8c8d;
            font-weight: bold;
            margin-top: 10px;
            white-space: nowrap;
        }

        .tomorrow-weather {
            flex: 2.2; /* 우측 예보 칸을 더 넓게 설정 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-left: 40px;
            height: 100%;
        }

        .tomorrow-title {
            margin: 0 0 20px 0;
            color: #2c3e50;
            font-size: 3rem; /* 폰트 확대 */
            font-weight: bold;
            white-space: nowrap;
        }

        .forecast-grid {
            display: flex;
            gap: 40px;
            width: 100%;
            justify-content: center;
        }

        .forecast-item {
            background: #f8fafc;
            padding: 35px 25px;
            border-radius: 20px;
            border: 2.5px solid #e2e8f0;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-slot {
            font-size: 2.5rem; /* 오전/오후 텍스트 크게 */
            font-weight: bold;
            color: #34495e;
            margin-bottom: 10px;
        }

        .small-icon img {
            width: 160px; /* 예보 아이콘 크게 */
            height: 160px;
        }

        .temp-range {
            font-size: 3rem; /* 온도 텍스트 크게 */
            font-weight: bold;
            margin-top: 10px;
        }
        .min-temp { color: #3498db; }
        .max-temp { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="weather-container">
        
        <!-- 왼쪽: 현재 대형 정보 영역 -->
        <div class="current-weather">
            <h1 class="location-title">📍 창원 양덕동</h1>
            <div class="weather-icon-box">
                <img id="current-icon" src="https://openweathermap.org/img/wn/01d@4x.png" alt="현재 날씨">
            </div>
            <div class="update-info" id="current-update">날씨 연결 시도 중...</div>
        </div>

        <!-- 오른쪽: 내일 예보 영역 -->
        <div class="tomorrow-weather">
            <h2 class="tomorrow-title">🔮 내일 날씨 예보</h2>
            
            <div class="forecast-grid">
                <!-- 내일 오전 -->
                <div class="forecast-item">
                    <div class="time-slot">오전 (09시)</div>
                    <div class="small-icon">
                        <img id="tomorrow-am-icon" src="https://openweathermap.org/img/wn/02d@2x.png" alt="내일 오전">
                    </div>
                    <div class="temp-range">
                        <span class="min-temp" id="tomorrow-am-min">--°</span> / 
                        <span class="max-temp" id="tomorrow-am-max">--°</span>
                    </div>
                </div>

                <!-- 내일 오후 -->
                <div class="forecast-item">
                    <div class="time-slot">오후 (15시)</div>
                    <div class="small-icon">
                        <img id="tomorrow-pm-icon" src="https://openweathermap.org/img/wn/04d@2x.png" alt="내일 오후">
                    </div>
                    <div class="temp-range">
                        <span class="min-temp" id="tomorrow-pm-min">--°</span> / 
                        <span class="max-temp" id="tomorrow-pm-max">--°</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 발급하신 소중한 키를 안전하게 입력해 두었습니다!
        const MY_API_KEY = 'a97c0cd9e895f21fc9caa030137a6632'; 

        async function fetchWeather() {
            const LAT = '35.2255';
            const LON = '128.5847';
            
            const currentUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${LAT}&lon=${LON}&appid=${MY_API_KEY}&units=metric`;
            const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${LAT}&lon=${LON}&appid=${MY_API_KEY}&units=metric`;

            try {
                // 1. 현재 날씨 가져오기
                const currentRes = await fetch(currentUrl);
                if (!currentRes.ok) throw new Error('API 호출 실패');
                const currentData = await currentRes.json();
                const currentIconCode = currentData.weather[0].icon;
                document.getElementById('current-icon').src = `https://openweathermap.org/img/wn/${currentIconCode}@4x.png`;

                // 시간 업데이트 표시
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                document.getElementById('current-update').innerText = `최근 갱신 ${hours}:${minutes}:${seconds}`;

                // 2. 내일 예보 가져오기
                const forecastRes = await fetch(forecastUrl);
                if (!forecastRes.ok) throw new Error('예보 API 호출 실패');
                const forecastData = await forecastRes.json();
                
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                const tomorrowStr = tomorrow.toISOString().split('T')[0];

                const amForecast = forecastData.list.find(item => item.dt_txt === `${tomorrowStr} 09:00:00`);
                const pmForecast = forecastData.list.find(item => item.dt_txt === `${tomorrowStr} 15:00:00`);

                if (amForecast) {
                    const amIcon = amForecast.weather[0].icon;
                    document.getElementById('tomorrow-am-icon').src = `https://openweathermap.org/img/wn/${amIcon}@2x.png`;
                    document.getElementById('tomorrow-am-min').innerText = `${Math.round(amForecast.main.temp_min)}°`;
                    document.getElementById('tomorrow-am-max').innerText = `${Math.round(amForecast.main.temp_max)}°`;
                }

                if (pmForecast) {
                    const pmIcon = pmForecast.weather[0].icon;
                    document.getElementById('tomorrow-pm-icon').src = `https://openweathermap.org/img/wn/${pmIcon}@2x.png`;
                    document.getElementById('tomorrow-pm-min').innerText = `${Math.round(pmForecast.main.temp_min)}°`;
                    document.getElementById('tomorrow-pm-max').innerText = `${Math.round(pmForecast.main.temp_max)}°`;
                }

            } catch (err) {
                console.error(err);
                document.getElementById('current-update').innerText = "통신 연결 대기 중...";
            }
        }

        // 최초 실행
        fetchWeather();

        // ⏱️ 1분(60,000ms)마다 새로고침 작동
        setInterval(fetchWeather, 60000);
    </script>

</body>
</html>
