<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창원NC파크 실시간 날씨 (기상청)</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #1e375a, #2980b9); 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden; 
        }
        
        .weather-container {
            background: rgba(255, 255, 255, 0.98);
            width: 96vw;    
            height: 92vh;   
            padding: 3vh 3vw; 
            border-radius: 4vh;
            box-shadow: 0 3vh 6vh rgba(0,0,0,0.45);
            display: flex;
            flex-direction: column; 
            justify-content: space-between;
            align-items: center;
        }

        .top-header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2vw;
            padding-bottom: 2vh; 
            border-bottom: 0.5vh solid #f1f5f9; 
            white-space: nowrap;
            flex-shrink: 0; 
        }

        .location-title {
            font-size: 3.2vw; 
            color: #2980b9; 
            font-weight: 900;
        }

        .current-date {
            font-size: 3.2vw;
            font-weight: 800;
            color: #34495e;
        }

        .current-time {
            font-size: 4.5vw;
            font-weight: 900;
            color: #1e375a;
            letter-spacing: -2px;
        }

        .header-divider {
            color: #cbd5e1;
            font-size: 3vw;
            font-weight: bold;
        }

        .main-content {
            width: 100%;
            flex: 1; 
            display: flex;
            align-items: stretch; 
            justify-content: space-between; 
            min-height: 0; 
            padding-top: 4vh; 
        }

        .current-weather {
            flex: 1; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            text-align: center;
            border-right: 0.4vw solid #e2e8f0;
            padding-right: 3vw; 
            height: 100%;
        }

        .tomorrow-weather {
            flex: 1; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            padding-left: 3vw; 
            height: 100%;
        }

        .today-title-box, .tomorrow-title-box {
            width: 100%;
            height: 6vh; 
            display: flex;
            align-items: center; 
            justify-content: center;
            gap: 1vw;
            margin-bottom: 3vh; 
            flex-shrink: 0;
        }

        .today-title, .tomorrow-title {
            margin: 0;
            font-size: 2.8vw; 
            color: #2c3e50;
            font-weight: 800;
            white-space: nowrap;
            line-height: 1; 
        }

        .update-info, .tomorrow-date {
            font-size: 1.5vw;
            font-weight: bold;
            color: #7f8c8d; 
            white-space: nowrap;
            line-height: 1;
        }

        .update-info {
            color: #b2bec3; 
        }

        .forecast-grid {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 2vw;
            height: 100%;
        }

        .weather-card {
            width: 100%;
            max-width: 42vw; 
            height: 52vh; 
            background: #f8fafc;
            border: 0.4vh solid #e2e8f0;
            border-radius: 4vh;
            padding: 3vh 2vw; 
            text-align: center;
            box-shadow: 0 1.5vh 3.5vh rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; 
        }

        .card-label {
            font-size: 2.5vw;
            font-weight: bold;
            color: #2c3e50;
        }

        .card-icon {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0; 
        }

        .card-icon img {
            height: 13vh; 
            width: auto;
            filter: drop-shadow(0 1vh 2vh rgba(0,0,0,0.18));
        }

        .card-temp-main {
            font-size: 5vw; 
            font-weight: 900;
            color: #e74c3c;
            line-height: 1;
            margin-bottom: 0.5vh;
        }

        .card-temp-sub {
            font-size: 2.2vw; 
            font-weight: bold;
            color: #34495e;
            margin-bottom: 1vh;
        }

        .card-info-badge {
            font-size: 1.5vw; 
            font-weight: 800;
            color: #2980b9;
            background: #eef2f7;
            padding: 1.2vh 1.8vw;
            border-radius: 2vh;
            white-space: nowrap;
            width: 100%; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1vw;
            flex-shrink: 0;
        }

        .min-temp {
            color: #3498db;
        }

        .max-temp {
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="weather-container">

    <div class="top-header">
        <span class="location-title">⚾ 창원NC파크</span>
        <span class="header-divider">|</span>
        <span class="current-date" id="current-date">00월 00일 (요일)</span>
        <span class="current-time" id="current-time">00:00:00</span>
    </div>

    <div class="main-content">
        
        <div class="current-weather">
            <div class="today-title-box">
                <h2 class="today-title">☀️ 오늘 날씨</h2>
                <span class="update-info" id="current-update">연결 대기 중...</span>
            </div>

            <div class="weather-card">
                <div class="card-label" id="weather-status">날씨 확인 중...</div>
                <div class="card-icon">
                    <img id="current-icon" src="https://openweathermap.org/img/wn/01d@4x.png" alt="현재 날씨">
                </div>
                <div class="card-temp-main" id="current-temp">--°</div>
                <div class="card-temp-sub">
                    <span class="min-temp" id="today-min">--°</span> / 
                    <span class="max-temp" id="today-max">--°</span>
                </div>
                <div class="card-info-badge" style="color: #34495e;">
                    <span>🌡 체감 <span id="feels-temp">--°</span></span>
                    <span>|</span>
                    <span>💧 습도 <span id="humidity">--%</span></span>
                </div>
            </div>
        </div>

        <div class="tomorrow-weather">
            <div class="tomorrow-title-box">
                <span class="tomorrow-title">🔮 내일 날씨</span>
                <span class="tomorrow-date" id="tomorrow-date">(00월 00일)</span>
            </div>

            <div class="forecast-grid">
                <div class="weather-card">
                    <div class="card-label">오전 (09시)</div>
                    <div class="card-icon">
                        <img id="tomorrow-am-icon" src="https://openweathermap.org/img/wn/02d@2x.png" alt="내일 오전">
                    </div>
                    <div class="card-temp-sub">
                        <span class="min-temp" id="tomorrow-am-min">--°</span> / 
                        <span class="max-temp" id="tomorrow-am-max">--°</span>
                    </div>
                    <div class="card-info-badge">☔ 강수확률 <span id="tomorrow-am-pop">--%</span></div>
                </div>

                <div class="weather-card">
                    <div class="card-label">오후 (15시)</div>
                    <div class="card-icon">
                        <img id="tomorrow-pm-icon" src="https://openweathermap.org/img/wn/04d@2x.png" alt="내일 오후">
                    </div>
                    <div class="card-temp-sub">
                        <span class="min-temp" id="tomorrow-pm-min">--°</span> / 
                        <span class="max-temp" id="tomorrow-pm-max">--°</span>
                    </div>
                    <div class="card-info-badge">☔ 강수확률 <span id="tomorrow-pm-pop">--%</span></div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    // 제공해주신 기상청 공공데이터 인코딩 인증키가 직접 이식되었습니다.
    const KMA_SERVICE_KEY = 'N%2B4uFclB3xLAFEdxPnZapi3snhIn0bkNpyVybsOsUWt3yxtSSd4tzGpmxH2IAX0CbniYDeBwkP6Sefav%2FRXgHA%3D%3D'; 
    
    // 창원NC파크 격자 좌표 (경남 창원시 마산회원구)
    const NX = 90; 
    const NY = 77; 

    function getKoreanDay(date) {
        const week = ['일', '월', '화', '수', '목', '금', '토'];
        return week[date.getDay()];
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('current-time').innerText = 
            `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
        document.getElementById('current-date').innerText = 
            `${now.getMonth() + 1}월 ${now.getDate()}일 (${getKoreanDay(now)})`;
    }

    function getSkyStatus(sky, pty) {
        if (pty > 0) {
            if (pty == 1 || pty == 4) return { text: "비", icon: "09d" };
            if (pty == 2) return { text: "비/눈", icon: "13d" };
            if (pty == 3) return { text: "눈", icon: "13d" };
        }
        if (sky == 1) return { text: "맑음", icon: "01d" };
        if (sky == 3) return { text: "구름많음", icon: "03d" };
        if (sky == 4) return { text: "흐림", icon: "04d" };
        return { text: "맑음", icon: "01d" };
    }

    // 기상청 단기예보의 가장 안정적인 base_time 세팅
    function getBaseDateTime() {
        const now = new Date();
        const hours = [2, 5, 8, 11, 14, 17, 20, 23];
        let currentHour = now.getHours();
        let baseTime = "2300";
        let targetDate = new Date(now);
        
        let checkTime = currentHour;
        if (now.getMinutes() < 40) {
            checkTime = currentHour - 1;
        }
        
        let found = false;
        for (let i = hours.length - 1; i >= 0; i--) {
            if (checkTime >= hours[i]) {
                baseTime = String(hours[i]).padStart(2, '0') + "00";
                found = true;
                break;
            }
        }
        
        if (!found) {
            targetDate.setDate(targetDate.getDate() - 1);
            baseTime = "2300";
        }
        
        let y = targetDate.getFullYear();
        let m = String(targetDate.getMonth() + 1).padStart(2, '0');
        let d = String(targetDate.getDate()).padStart(2, '0');
        
        return { baseDate: `${y}${m}${d}`, baseTime };
    }

    async function fetchKMAWeather() {
        const { baseDate, baseTime } = getBaseDateTime();
        
        // 기상청 단기예보 조회 API 오리지널 주소
        const targetUrl = `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst?serviceKey=${KMA_SERVICE_KEY}&pageNo=1&numOfRows=1000&dataType=JSON&base_date=${baseDate}&base_time=${baseTime}&nx=${NX}&ny=${NY}`;
        
        // CORS 및 통신 환경에 따른 로컬 보안 차단 대비용 우회 우회 서버(Proxy) 경로
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

        let response;
        let jsonData;
        let connectionMode = "직접";

        try {
            document.getElementById('current-update').innerText = "데이터 요청 중...";
            document.getElementById('weather-status').innerText = "연결 시도 중";

            // 1차 시도: 원본 API 호출
            response = await fetch(targetUrl);
            if (response.ok) {
                jsonData = await response.json();
            } else {
                throw new Error("Direct Fetch Failed");
            }
        } catch (directError) {
            console.log("기상청 원본 직접 연결 실패 -> CORS 우회 모드 작동");
            try {
                // 2차 시도: 우회(CorsProxy) 경로로 재시도
                response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Proxy Response Error");
                jsonData = await response.json();
                connectionMode = "우회";
            } catch (proxyError) {
                console.error(proxyError);
                document.getElementById('current-update').innerText = "(기상청 서버 응답 에러)";
                document.getElementById('weather-status').innerText = "연결 점검 필요";
                return;
            }
        }

        try {
            if (!jsonData || !jsonData.response) {
                document.getElementById('current-update').innerText = "(서버 데이터 에러)";
                document.getElementById('weather-status').innerText = "응답 에러";
                return;
            }

            const header = jsonData.response.header;
            if (header.resultCode !== "00") {
                let errorMsg = `에러: ${header.resultCode}`;
                let statusMsg = "연결 에러";
                
                // 기상청 고유 거부 코드 해석기
                if (header.resultCode === "20" || header.resultCode === "30") {
                    errorMsg = "(키 동기화 승인 대기중)";
                    statusMsg = "키 승인 대기";
                } else if (header.resultCode === "12" || header.resultCode === "22") {
                    errorMsg = "(인증키 만료 혹은 무효)";
                    statusMsg = "키 오류";
                }
                document.getElementById('current-update').innerText = errorMsg;
                document.getElementById('weather-status').innerText = statusMsg;
                return;
            }

            const items = jsonData.response.body.items.item;
            const now = new Date();
            const todayStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
            
            const tomorrow = new Date(Date.now() + 86400000);
            const tomorrowStr = `${tomorrow.getFullYear()}${String(tomorrow.getMonth()+1).padStart(2,'0')}${String(tomorrow.getDate()).padStart(2,'0')}`;
            document.getElementById('tomorrow-date').innerText = `(${tomorrow.getMonth() + 1}월 ${tomorrow.getDate()}일)`;

            // --- 오늘 현재 데이터 추출 및 조립 ---
            const currentHourStr = String(now.getHours()).padStart(2, '0') + "00";
            const todayItems = items.filter(x => x.fcstDate === todayStr);
            
            let curTemp = "--", curSky = "1", curPty = "0", curHum = "--";
            
            let curHourData = todayItems.filter(x => x.fcstTime === currentHourStr);
            if (curHourData.length === 0 && todayItems.length > 0) {
                curHourData = todayItems.filter(x => x.fcstTime === todayItems[0].fcstTime);
            }
            
            if(curHourData.length > 0) {
                curTemp = curHourData.find(x => x.category === 'TMP')?.fcstValue || "--";
                curSky = curHourData.find(x => x.category === 'SKY')?.fcstValue || "1";
                curPty = curHourData.find(x => x.category === 'PTY')?.fcstValue || "0";
                curHum = curHourData.find(x => x.category === 'REH')?.fcstValue || "--";
            }

            const tmnItem = todayItems.find(x => x.category === 'TMN');
            const tmxItem = todayItems.find(x => x.category === 'TMX');
            
            document.getElementById('current-temp').innerText = curTemp + "°";
            document.getElementById('today-min').innerText = tmnItem ? Math.round(tmnItem.fcstValue) + "°" : "--°";
            document.getElementById('today-max').innerText = tmxItem ? Math.round(tmxItem.fcstValue) + "°" : "--°";
            document.getElementById('humidity').innerText = curHum + "%";
            
            if(curTemp !== "--" && curHum !== "--") {
                const T = parseFloat(curTemp);
                const RH = parseFloat(curHum);
                const tw = T * Math.atan(0.151977 * Math.pow(RH + 8.313659, 0.5)) + Math.atan(T + RH) - Math.atan(RH - 1.676331) + 0.00391838 * Math.pow(RH, 1.5) * Math.atan(0.023101 * RH) - 4.686035;
                document.getElementById('feels-temp').innerText = Math.round(tw) + "°";
            }

            const statusObj = getSkyStatus(curSky, curPty);
            document.getElementById('weather-status').innerText = statusObj.text;
            document.getElementById('current-icon').src = `https://openweathermap.org/img/wn/${statusObj.icon}@4x.png`;
            
            document.getElementById('current-update').innerText = `(${baseTime.substring(0,2)}시 발표, ${connectionMode} 연결)`;

            // --- 내일 예보 데이터 추출 및 조립 ---
            const tomorrowItems = items.filter(x => x.fcstDate === tomorrowStr);
            
            const tmTomorrowMin = tomorrowItems.find(x => x.category === 'TMN')?.fcstValue || "--";
            const tmTomorrowMax = tomorrowItems.find(x => x.category === 'TMX')?.fcstValue || "--";

            const amItems = tomorrowItems.filter(x => x.fcstTime === '0900');
            if(amItems.length > 0) {
                const amSky = amItems.find(x => x.category === 'SKY')?.fcstValue || "1";
                const amPty = amItems.find(x => x.category === 'PTY')?.fcstValue || "0";
                const amPop = amItems.find(x => x.category === 'POP')?.fcstValue || "0";
                const amStatus = getSkyStatus(amSky, amPty);

                document.getElementById('tomorrow-am-icon').src = `https://openweathermap.org/img/wn/${amStatus.icon}@2x.png`;
                document.getElementById('tomorrow-am-pop').innerText = amPop + "%";
                document.getElementById('tomorrow-am-min').innerText = tmTomorrowMin !== "--" ? Math.round(tmTomorrowMin) + "°" : "--°";
                document.getElementById('tomorrow-am-max').innerText = tmTomorrowMax !== "--" ? Math.round(tmTomorrowMax) + "°" : "--°";
            }

            const pmItems = tomorrowItems.filter(x => x.fcstTime === '1500');
            if(pmItems.length > 0) {
                const pmSky = pmItems.find(x => x.category === 'SKY')?.fcstValue || "1";
                const pmPty = pmItems.find(x => x.category === 'PTY')?.fcstValue || "0";
                const pmPop = pmItems.find(x => x.category === 'POP')?.fcstValue || "0";
                const pmStatus = getSkyStatus(pmSky, pmPty);

                document.getElementById('tomorrow-pm-icon').src = `https://openweathermap.org/img/wn/${pmStatus.icon}@2x.png`;
                document.getElementById('tomorrow-pm-pop').innerText = pmPop + "%";
                document.getElementById('tomorrow-pm-min').innerText = tmTomorrowMin !== "--" ? Math.round(tmTomorrowMin) + "°" : "--°";
                document.getElementById('tomorrow-pm-max').innerText = tmTomorrowMax !== "--" ? Math.round(tmTomorrowMax) + "°" : "--°";
            }

        } catch (e) {
            console.error(e);
            document.getElementById('current-update').innerText = "(데이터 가공 에러)";
            document.getElementById('weather-status').innerText = "가공 실패";
        }
    }

    updateClock();
    setInterval(updateClock, 1000);

    fetchKMAWeather();
    setInterval(fetchKMAWeather, 600000); // 10분마다 자동 갱신
</script>

</body>
</html>
