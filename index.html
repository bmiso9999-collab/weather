<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창원NC파크 7일 날씨 예보 (기상청)</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #1e375a, #2980b9); 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden; 
        }
        
        .weather-container {
            background: rgba(255, 255, 255, 0.98);
            width: 96vw;    
            height: 92vh;   
            padding: 3vh 2vw; 
            border-radius: 4vh;
            box-shadow: 0 3vh 6vh rgba(0,0,0,0.45);
            display: flex;
            flex-direction: column; 
            justify-content: space-between;
            align-items: center;
        }

        /* 상단 헤더 */
        .top-header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2vw;
            padding-bottom: 2vh; 
            border-bottom: 0.5vh solid #f1f5f9; 
            white-space: nowrap;
            flex-shrink: 0; 
        }

        .location-title {
            font-size: 3.2vw; 
            color: #2980b9; 
            font-weight: 900;
        }

        .current-date {
            font-size: 3.2vw;
            font-weight: 800;
            color: #34495e;
        }

        .current-time {
            font-size: 4.5vw;
            font-weight: 900;
            color: #1e375a;
            letter-spacing: -2px;
        }

        .header-divider {
            color: #cbd5e1;
            font-size: 3vw;
            font-weight: bold;
        }

        /* 7일 예보 메인 영역 */
        .main-content {
            width: 100%;
            flex: 1; 
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            min-height: 0; 
            padding-top: 2vh; 
            position: relative;
        }

        .update-info {
            position: absolute;
            top: 0.5vh;
            right: 1vw;
            font-size: 1.1vw;
            font-weight: bold;
            color: #b2bec3;
        }

        /* 7개 카드 그리드 배치 */
        .weekly-grid {
            width: 100%;
            height: 68vh;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1vw;
            align-items: center;
            margin-top: 1vh;
        }

        .day-card {
            background: #f8fafc;
            border: 0.3vh solid #e2e8f0;
            border-radius: 2.5vh;
            padding: 2.5vh 0.8vw;
            text-align: center;
            box-shadow: 0 1vh 2vh rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100%;
        }

        .day-card.today {
            background: #ffffff;
            border: 0.4vh solid #2980b9;
            box-shadow: 0 1.5vh 3vh rgba(41, 128, 185, 0.2);
        }

        .card-date-header {
            font-size: 1.7vw;
            font-weight: 900;
            color: #2c3e50;
            line-height: 1.2;
            white-space: nowrap;
        }

        .icon-weather-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0;
            margin: 0;
            width: 100%;
        }

        .card-icon-img {
            height: 24vh;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 1vh 2vh rgba(0,0,0,0.18));
            margin-bottom: -1.5vh;
            margin-top: -1vh;
        }

        .card-status-text {
            font-size: 1.6vw;
            font-weight: 800;
            color: #34495e;
            white-space: nowrap;
            margin-top: 0;
        }

        .card-temp-sub {
            font-size: 2vw;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 1.2vh;
            white-space: nowrap;
        }

        .card-info-badge {
            font-size: 1.3vw;
            font-weight: 800;
            color: #2980b9;
            background: #eef2f7;
            padding: 1vh 0.5vw;
            border-radius: 1.5vh;
            white-space: nowrap;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.3vw;
            flex-shrink: 0;
        }

        .min-temp {
            color: #3498db;
        }

        .max-temp {
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="weather-container">

    <!-- 상단 헤더 -->
    <div class="top-header">
        <span class="location-title">⚾ 창원NC파크</span>
        <span class="header-divider">|</span>
        <span class="current-date" id="current-date">00월 00일 (요일)</span>
        <span class="current-time" id="current-time">00:00:00</span>
    </div>

    <!-- 7일 예보 메인 화면 -->
    <div class="main-content">
        <span class="update-info" id="current-update">연결 대기 중...</span>

        <div class="weekly-grid" id="weekly-grid">
            <!-- JavaScript로 7개 카드가 생성됩니다 -->
        </div>
    </div>

</div>

<script>
    const KMA_SERVICE_KEY = 'N%2B4uFclB3xLAFEdxPnZapi3snhIn0bkNpyVybsOsUWt3yxtSSd4tzGpmxH2IAX0CbniYDeBwkP6Sefav%2FRXgHA%3D%3D'; 
    
    const NX = 90; 
    const NY = 77; 
    const REG_ID_TEMP = '11H20301'; // 창원 기온 구역 코드
    const REG_ID_LAND = '11H20000'; // 경남 육상예보 구역 코드

    function getKoreanDay(date) {
        const week = ['일', '월', '화', '수', '목', '금', '토'];
        return week[date.getDay()];
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('current-time').innerText = 
            `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
        document.getElementById('current-date').innerText = 
            `${now.getMonth() + 1}월 ${now.getDate()}일 (${getKoreanDay(now)})`;
    }

    function getWeatherMeta(text) {
        if (!text) return { text: "맑음", icon: "01d" };
        if (text.includes("비/눈")) return { text: "비/눈", icon: "13d" };
        if (text.includes("비")) return { text: "비", icon: "09d" };
        if (text.includes("눈")) return { text: "눈", icon: "13d" };
        if (text.includes("흐림") || text.includes("흐리고")) return { text: "흐림", icon: "04d" };
        if (text.includes("구름많")) return { text: "구름많음", icon: "03d" };
        if (text.includes("맑")) return { text: "맑음", icon: "01d" };
        return { text: text, icon: "01d" };
    }

    function getBaseDateTime() {
        const now = new Date();
        const hours = [2, 5, 8, 11, 14, 17, 20, 23];
        let currentHour = now.getHours();
        let baseTime = "2300";
        let targetDate = new Date(now);
        
        let checkTime = (now.getMinutes() < 40) ? currentHour - 1 : currentHour;
        
        let found = false;
        for (let i = hours.length - 1; i >= 0; i--) {
            if (checkTime >= hours[i]) {
                baseTime = String(hours[i]).padStart(2, '0') + "00";
                found = true;
                break;
            }
        }
        
        if (!found) {
            targetDate.setDate(targetDate.getDate() - 1);
            baseTime = "2300";
        }
        
        let y = targetDate.getFullYear();
        let m = String(targetDate.getMonth() + 1).padStart(2, '0');
        let d = String(targetDate.getDate()).padStart(2, '0');
        
        return { baseDate: `${y}${m}${d}`, baseTime };
    }

    function getMidBaseTime() {
        const now = new Date();
        let targetDate = new Date(now);
        let baseTime = "0600";

        if (now.getHours() < 6) {
            targetDate.setDate(targetDate.getDate() - 1);
            baseTime = "1800";
        } else if (now.getHours() < 18) {
            baseTime = "0600";
        } else {
            baseTime = "1800";
        }

        let y = targetDate.getFullYear();
        let m = String(targetDate.getMonth() + 1).padStart(2, '0');
        let d = String(targetDate.getDate()).padStart(2, '0');

        return `${y}${m}${d}${baseTime}`;
    }

    async function safeFetchJson(url) {
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
        try {
            let res = await fetch(url);
            if (!res.ok) res = await fetch(proxyUrl);
            if (res.ok) return await res.json();
        } catch (e) {
            try {
                let resProxy = await fetch(proxyUrl);
                if (resProxy.ok) return await resProxy.json();
            } catch (err) {
                return null;
            }
        }
        return null;
    }

    async function fetch7DaysWeather() {
        const { baseDate, baseTime } = getBaseDateTime();
        const midTmFc = getMidBaseTime();

        const fcstUrl = `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst?serviceKey=${KMA_SERVICE_KEY}&pageNo=1&numOfRows=1000&dataType=JSON&base_date=${baseDate}&base_time=${baseTime}&nx=${NX}&ny=${NY}`;
        const midLandUrl = `https://apis.data.go.kr/1360000/MidFcstInfoService/getMidLandFcst?serviceKey=${KMA_SERVICE_KEY}&pageNo=1&numOfRows=10&dataType=JSON&regId=${REG_ID_LAND}&tmFc=${midTmFc}`;
        const midTempUrl = `https://apis.data.go.kr/1360000/MidFcstInfoService/getMidTa?serviceKey=${KMA_SERVICE_KEY}&pageNo=1&numOfRows=10&dataType=JSON&regId=${REG_ID_TEMP}&tmFc=${midTmFc}`;

        document.getElementById('current-update').innerText = "데이터 수신 중...";

        const [fcstJson, midLandJson, midTempJson] = await Promise.all([
            safeFetchJson(fcstUrl),
            safeFetchJson(midLandUrl),
            safeFetchJson(midTempUrl)
        ]);

        const weeklyData = [];
        const now = new Date();

        for (let i = 0; i < 7; i++) {
            const d = new Date();
            d.setDate(now.getDate() + i);
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            
            weeklyData.push({
                dayOffset: i, 
                dateStr: `${yyyy}${mm}${dd}`,
                monthDay: `${d.getMonth() + 1}/${d.getDate()}`,
                dayOfWeek: getKoreanDay(d),
                isToday: i === 0,
                minTemp: "--",
                maxTemp: "--",
                pop: "0",
                statusText: "예보 대기",
                icon: "01d"
            });
        }

        // --- A. 단기예보 처리 (1~3일차) ---
        if (fcstJson?.response?.body?.items?.item) {
            const items = fcstJson.response.body.items.item;

            weeklyData.slice(0, 3).forEach(dayObj => {
                const dayItems = items.filter(x => x.fcstDate === dayObj.dateStr);
                if (dayItems.length > 0) {
                    const tmn = dayItems.find(x => x.category === 'TMN')?.fcstValue;
                    const tmx = dayItems.find(x => x.category === 'TMX')?.fcstValue;
                    const tmps = dayItems.filter(x => x.category === 'TMP').map(x => parseFloat(x.fcstValue));

                    dayObj.minTemp = tmn ? Math.round(parseFloat(tmn)) : (tmps.length ? Math.round(Math.min(...tmps)) : "--");
                    dayObj.maxTemp = tmx ? Math.round(parseFloat(tmx)) : (tmps.length ? Math.round(Math.max(...tmps)) : "--");

                    const pops = dayItems.filter(x => x.category === 'POP').map(x => parseInt(x.fcstValue));
                    dayObj.pop = pops.length ? Math.max(...pops) : 0;

                    let targetItem = dayItems.find(x => x.fcstTime === '1500') || dayItems[0];
                    const sky = targetItem ? dayItems.find(x => x.fcstTime === targetItem.fcstTime && x.category === 'SKY')?.fcstValue : "1";
                    const pty = targetItem ? dayItems.find(x => x.fcstTime === targetItem.fcstTime && x.category === 'PTY')?.fcstValue : "0";

                    let rawText = "맑음";
                    if (pty > 0) rawText = pty == 1 ? "비" : (pty == 2 ? "비/눈" : "눈");
                    else rawText = sky == 4 ? "흐림" : (sky == 3 ? "구름많음" : "맑음");

                    const meta = getWeatherMeta(rawText);
                    dayObj.statusText = meta.text;
                    dayObj.icon = meta.icon;
                }
            });
        }

        // --- B. 중기예보 처리 (4~7일차) ---
        const landItem = midLandJson?.response?.body?.items?.item?.[0];
        const tempItem = midTempJson?.response?.body?.items?.item?.[0];

        weeklyData.forEach((dayObj, index) => {
            if (dayObj.dayOffset >= 3 || dayObj.minTemp === "--") {
                const idx = dayObj.dayOffset; 
                
                if (tempItem) {
                    const minVal = tempItem[`taMin${idx}`];
                    const maxVal = tempItem[`taMax${idx}`];
                    if (minVal !== undefined && minVal !== null) dayObj.minTemp = minVal;
                    if (maxVal !== undefined && maxVal !== null) dayObj.maxTemp = maxVal;
                }

                if (landItem) {
                    const popPm = landItem[`rnSt${idx}Pm`] ?? landItem[`rnSt${idx}`] ?? 0;
                    const wfPm = landItem[`wf${idx}Pm`] ?? landItem[`wf${idx}`] ?? "맑음";

                    dayObj.pop = popPm;
                    const meta = getWeatherMeta(wfPm);
                    dayObj.statusText = meta.text;
                    dayObj.icon = meta.icon;
                }

                // 4일차(index 3) 예외 방어: 18시 발표 중기예보 특성상 taMin3가 누락되었을 때 3일차 기온 보완
                if (dayObj.minTemp === "--" && index > 0) {
                    dayObj.minTemp = weeklyData[index - 1].minTemp;
                    dayObj.maxTemp = weeklyData[index - 1].maxTemp;
                }
            }
        });

        renderWeeklyGrid(weeklyData);
        
        // 기상청 발표 시각 포맷팅 (예: 1400 -> 14:00)
        const formattedBaseTime = `${baseTime.substring(0, 2)}:${baseTime.substring(2, 4)}`;
        // 브라우저 동기화 시각 (HH:MM)
        const updateTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        if (!midLandJson || !midTempJson) {
            document.getElementById('current-update').innerText = `(기상청 ${formattedBaseTime} 발표 | 승인 대기 중)`;
        } else {
            document.getElementById('current-update').innerText = `(기상청 ${formattedBaseTime} 발표 | ${updateTimeStr} 동기화)`;
        }
    }

    function renderWeeklyGrid(dataList) {
        const gridContainer = document.getElementById('weekly-grid');
        gridContainer.innerHTML = '';

        dataList.forEach(data => {
            const dateLabel = data.isToday ? `오늘(${data.dayOfWeek})` : `${data.monthDay}(${data.dayOfWeek})`;
            const cardClass = data.isToday ? 'day-card today' : 'day-card';

            const cardHtml = `
                <div class="${cardClass}">
                    <div class="card-date-header">${dateLabel}</div>
                    
                    <div class="icon-weather-box">
                        <img class="card-icon-img" src="https://openweathermap.org/img/wn/${data.icon}@4x.png" alt="${data.statusText}">
                        <div class="card-status-text">${data.statusText}</div>
                    </div>

                    <div class="card-temp-sub">
                        <span class="min-temp">${data.minTemp}°</span> / 
                        <span class="max-temp">${data.maxTemp}°</span>
                    </div>

                    <div class="card-info-badge">
                        ☔ 강수 <span style="color:#e74c3c;">${data.pop}%</span>
                    </div>
                </div>
            `;
            gridContainer.insertAdjacentHTML('beforeend', cardHtml);
        });
    }

    updateClock();
    setInterval(updateClock, 1000);

    fetch7DaysWeather();
    setInterval(fetch7DaysWeather, 600000); 
</script>

</body>
</html>
