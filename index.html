<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창원NC파크 실시간 날씨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 30px 25px;
            text-align: center;
        }

        .location-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a2530;
            margin-bottom: 5px;
        }

        .update-time {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 25px;
        }

        .weather-main {
            margin-bottom: 25px;
        }

        .temp-display {
            font-size: 3.8rem;
            font-weight: 800;
            color: #2c3e50;
            line-height: 1;
            margin-bottom: 10px;
        }

        .sky-state {
            font-size: 1.2rem;
            font-weight: 600;
            color: #3498db;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            background: #f8fafc;
            padding: 18px;
            border-radius: 12px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .detail-label {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 1rem;
            font-weight: 700;
            color: #1e293b;
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="location-title">창원NC파크 날씨</div>
    <div class="update-time" id="update-time">날씨 정보 불러오는 중...</div>

    <div class="weather-main">
        <div class="temp-display" id="temp">--°C</div>
        <div class="sky-state" id="sky">--</div>
    </div>

    <div class="weather-details">
        <div class="detail-item">
            <span class="detail-label">강수확률 / 형태</span>
            <span class="detail-value" id="pty">--</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">습도</span>
            <span class="detail-value" id="reh">--%</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">일강수량</span>
            <span class="detail-value" id="rn1">--</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">풍속</span>
            <span class="detail-value" id="wsd">-- m/s</span>
        </div>
    </div>
    
    <div class="error-message" id="error-msg"></div>
</div>

<script>
    // 공공데이터포털 API Key (인코딩/디코딩 키에 맞춰 자동 처리)
    const API_KEY = '5%2FvP5A8pByy3SByY8I0c3u5qYl1T6L9D3q6R8m2K1v0J3H5G7F9E1D3C5B7A9%3D%3D'; // 기존 키 유지
    const NX = 90; // 창원NC파크 격자 X
    const NY = 77; // 창원NC파크 격자 Y

    // CORS 프록시 서버 목록 (실패 대비)
    const PROXIES = [
        url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
    ];

    async function safeFetchJson(targetUrl) {
        // 프록시 없이 직접 요청 시도
        try {
            const res = await fetch(targetUrl);
            if (res.ok) return await res.json();
        } catch (e) {}

        // 프록시 순차 시도
        for (const proxy of PROXIES) {
            try {
                const res = await fetch(proxy(targetUrl));
                if (res.ok) return await res.json();
            } catch (e) {
                continue;
            }
        }
        return null;
    }

    // 초단기예보용 BaseTime 구하기 (매시 45분 기준)
    function getUltraSrtFcstBaseDateTime() {
        const now = new Date();
        if (now.getMinutes() < 45) {
            now.setHours(now.getHours() - 1);
        }
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        return { baseDate: `${y}${m}${d}`, baseTime: `${hh}30` };
    }

    // 단기예보용 BaseTime 구하기 (최신 3시간 단위)
    function getVilageFcstBaseDateTime() {
        const now = new Date();
        const times = [2, 5, 8, 11, 14, 17, 20, 23];
        let hour = now.getHours();
        
        // 정시 기준 10분 이전이면 이전 예보시간 선택
        if (now.getMinutes() < 10) hour -= 1;
        
        let targetHour = times.reduce((prev, curr) => curr <= hour ? curr : prev, 23);
        
        if (hour < 2) {
            now.setDate(now.getDate() - 1);
            targetHour = 23;
        }

        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const hh = String(targetHour).padStart(2, '0');

        return { baseDate: `${y}${m}${d}`, baseTime: `${hh}00` };
    }

    async function fetchWeather() {
        const errorMsg = document.getElementById('error-msg');
        errorMsg.innerText = '';

        const now = new Date();
        const currentHourStr = String(now.getHours()).padStart(2, '0') + '00';

        // 1. 초단기예보 API (현재 시각 보정 기온 및 실시간 날씨 데이터)
        const ultraDt = getUltraSrtFcstBaseDateTime();
        const decodedKey = decodeURIComponent(API_KEY);
        
        const ultraFcstUrl = `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtFcst?serviceKey=${encodeURIComponent(decodedKey)}&pageNo=1&numOfRows=60&dataType=JSON&base_date=${ultraDt.baseDate}&base_time=${ultraDt.baseTime}&nx=${NX}&ny=${NY}`;
        
        // 2. 단기예보 API (강수확률 및 보완 데이터)
        const vilageDt = getVilageFcstBaseDateTime();
        const vilageFcstUrl = `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst?serviceKey=${encodeURIComponent(decodedKey)}&pageNo=1&numOfRows=60&dataType=JSON&base_date=${vilageDt.baseDate}&base_time=${vilageDt.baseTime}&nx=${NX}&ny=${NY}`;

        const [ultraData, vilageData] = await Promise.all([
            safeFetchJson(ultraFcstUrl),
            safeFetchJson(vilageFcstUrl)
        ]);

        if (!ultraData || !ultraData.response?.body?.items?.item) {
            errorMsg.innerText = '날씨 데이터를 불러오는 데 실패했습니다.';
            return;
        }

        const ultraItems = ultraData.response.body.items.item;
        const vilageItems = vilageData?.response?.body?.items?.item || [];

        // 현재 시간대와 가장 가까운 예보값 추출
        let temp = ultraItems.find(x => x.category === 'T1H')?.fcstValue; // 초단기 예보 기온 (네이버 기온과 가장 유사)
        let skyCode = ultraItems.find(x => x.category === 'SKY')?.fcstValue;
        let ptyCode = ultraItems.find(x => x.category === 'PTY')?.fcstValue;
        let reh = ultraItems.find(x => x.category === 'REH')?.fcstValue;
        let rn1 = ultraItems.find(x => x.category === 'RN1')?.fcstValue;
        let wsd = ultraItems.find(x => x.category === 'WSD')?.fcstValue;
        let pop = vilageItems.find(x => x.category === 'POP')?.fcstValue; // 강수확률

        // 하늘상태 해석
        const skyText = { '1': '☀️ 맑음', '3': '⛅ 구름많음', '4': '☁️ 흐림' };
        const ptyText = { '0': '없음', '1': '비', '2': '비/눈', '3': '눈', '5': '빗방울', '6': '빗방울눈날림', '7': '눈날림' };

        // 화면 업데이트
        document.getElementById('temp').innerText = temp ? `${temp}°C` : '--°C';
        document.getElementById('sky').innerText = skyText[skyCode] || '정보없음';
        
        let ptyDisplay = ptyText[ptyCode] || '없음';
        if (pop && ptyCode === '0') {
            ptyDisplay = `강수확률 ${pop}%`;
        } else if (ptyCode !== '0') {
            ptyDisplay = `${ptyText[ptyCode]} (${pop || 0}%)`;
        }
        document.getElementById('pty').innerText = ptyDisplay;

        document.getElementById('reh').innerText = reh ? `${reh}%` : '--%';
        document.getElementById('rn1').innerText = (rn1 && rn1 !== '강수없음') ? rn1 : '0mm';
        document.getElementById('wsd').innerText = wsd ? `${wsd} m/s` : '-- m/s';

        const timeString = `${now.getMonth() + 1}월 ${now.getDate()}일 ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')} 기준`;
        document.getElementById('update-time').innerText = timeString;
    }

    // 실행
    fetchWeather();
</script>
</body>
</html>
