<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창원NC파크 실시간 날씨 (TV용)</title>
    <style>
        /* 모든 크기를 화면 높이/너비 비율(vh/vw) 기반으로 통일하여 완벽 스케일링 */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #1e375a, #2980b9); 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden; 
        }
        
        /* 메인 컨테이너 */
        .weather-container {
            background: rgba(255, 255, 255, 0.98);
            width: 94vw;    
            height: 90vh;   
            padding: 3vh 3vw; 
            border-radius: 3vh;
            box-shadow: 0 2vh 5vh rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column; 
            justify-content: space-between;
            align-items: center;
        }

        /* =====================
           상단 공통 헤더
        ===================== */
        .top-header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5vw;
            padding-bottom: 2vh; 
            border-bottom: 0.4vh solid #f1f5f9; 
            white-space: nowrap;
            flex-shrink: 0; 
        }

        .location-title {
            font-size: 3.5vh; /* TV 기준 글자 크기도 vh로 변경 */
            color: #2980b9; 
            font-weight: bold;
        }

        .current-date {
            font-size: 3.8vh;
            font-weight: bold;
            color: #34495e;
        }

        .current-time {
            font-size: 5vh;
            font-weight: 900;
            color: #1e375a;
            letter-spacing: -1px;
        }

        .header-divider {
            color: #cbd5e1;
            font-size: 3.5vh;
            font-weight: bold;
        }

        /* =====================
           본문 영역 (좌우 1:1 완벽 대칭)
        ===================== */
        .main-content {
            width: 100%;
            flex: 1; 
            display: flex;
            align-items: center; 
            justify-content: space-between; 
            min-height: 0; 
            padding-top: 2vh;
        }

        .current-weather {
            flex: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            text-align: center;
            border-right: 0.3vw solid #e2e8f0;
            padding-right: 2vw; 
            height: 100%;
        }

        .tomorrow-weather {
            flex: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            padding-left: 2vw; 
            height: 100%;
        }

        /* 타이틀 영역 */
        .today-title-box, .tomorrow-title-box {
            display: flex;
            align-items: center; 
            justify-content: center;
            gap: 1vw;
            margin-bottom: 2.5vh; 
            flex-shrink: 0;
        }

        .today-title, .tomorrow-title {
            margin: 0;
            font-size: 4vh; /* 글자 크기 스케일 업 */
            color: #2c3e50;
            font-weight: bold;
            white-space: nowrap;
        }

        .update-info {
            font-size: 1.8vh;
            font-weight: normal;
            color: #b2bec3; 
            white-space: nowrap;
        }

        .tomorrow-date {
            font-size: 3vh;
            color: #7f8c8d;
            font-weight: bold;
        }

        /* 내일 예보 2개 카드 정렬 */
        .forecast-grid {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 2vw;
            height: 100%;
        }

        /* =====================
           개별 날씨 카드 디자인 (TV 최적화)
        ===================== */
        .weather-card {
            width: 100%;
            max-width: 25vw; 
            height: 52vh; /* 전체 화면의 정확히 52% 배정해 절대 탈출하지 않도록 제어 */
            background: #f8fafc;
            border: 0.3vh solid #e2e8f0;
            border-radius: 3vh;
            padding: 3vh 1.5vw; 
            text-align: center;
            box-shadow: 0 1vh 3vh rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; 
        }

        /* 카드 내부 콘텐츠 유연성 세팅 */
        .card-label {
            font-size: 3.2vh;
            font-weight: bold;
            color: #2c3e50;
        }

        .card-icon {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0; 
        }

        .card-icon img {
            height: 14vh; /* 고정 px 대신 화면 높이의 14%로 아이콘을 자동 조절 */
            width: auto;
            filter: drop-shadow(0 1vh 1.5vh rgba(0,0,0,0.15));
        }

        .card-temp-main {
            font-size: 6.5vh; /* 최고 대표 온도 크기 조정 */
            font-weight: 900;
            color: #e74c3c;
            line-height: 1;
            margin-bottom: 1vh;
        }

        .card-temp-sub {
            font-size: 3.2vh; 
            font-weight: bold;
            color: #34495e;
            margin-bottom: 1.5vh;
        }

        .card-info-badge {
            font-size: 2.2vh; /* 텍스트 큼직하게 조정 */
            font-weight: bold;
            color: #2980b9;
            background: #eef2f7;
            padding: 1.2vh 1.5vw;
            border-radius: 1.5vh;
            white-space: nowrap;
            width: 100%; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1vw;
            flex-shrink: 0;
        }

        .min-temp {
            color: #3498db;
        }

        .max-temp {
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="weather-container">

    <!-- 1. 상단 공통 헤더 -->
    <div class="top-header">
        <span class="location-title">⚾ 창원NC파크</span>
        <span class="header-divider">|</span>
        <span class="current-date" id="current-date">00월 00일 (요일)</span>
        <span class="current-time" id="current-time">00:00:00</span>
    </div>

    <!-- 2. 하단 날씨 본문 영역 -->
    <div class="main-content">
        
        <!-- 왼쪽: 현재 및 오늘 날씨 -->
        <div class="current-weather">
            <div class="today-title-box">
                <h2 class="today-title">☀️ 오늘 날씨</h2>
                <span class="update-info" id="current-update">갱신 중...</span>
            </div>

            <div class="weather-card">
                <div class="card-label" id="weather-status">날씨 확인 중...</div>
                <div class="card-icon">
                    <img id="current-icon" src="https://openweathermap.org/img/wn/01d@4x.png" alt="현재 날씨">
                </div>
                <div class="card-temp-main" id="current-temp">--°</div>
                <div class="card-temp-sub">
                    <span class="min-temp" id="today-min">--°</span> / 
                    <span class="max-temp" id="today-max">--°</span>
                </div>
                <div class="card-info-badge" style="color: #34495e;">
                    <span>🌡 체감 <span id="feels-temp">--°</span></span>
                    <span>|</span>
                    <span>💧 습도 <span id="humidity">--%</span></span>
                </div>
            </div>
        </div>

        <!-- 오른쪽: 내일 날씨 예보 -->
        <div class="tomorrow-weather">
            <div class="tomorrow-title-box">
                <span class="tomorrow-title">🔮 내일 날씨</span>
                <span class="tomorrow-date" id="tomorrow-date">(00월 00일)</span>
            </div>

            <div class="forecast-grid">
                <!-- 내일 오전 카드 -->
                <div class="weather-card">
                    <div class="card-label">오전 (09시)</div>
                    <div class="card-icon">
                        <img id="tomorrow-am-icon" src="https://openweathermap.org/img/wn/02d@2x.png" alt="내일 오전">
                    </div>
                    <div class="card-temp-sub">
                        <span class="min-temp" id="tomorrow-am-min">--°</span> / 
                        <span class="max-temp" id="tomorrow-am-max">--°</span>
                    </div>
                    <div class="card-info-badge">☔ 강수확률 <span id="tomorrow-am-pop">--%</span></div>
                </div>

                <!-- 내일 오후 카드 -->
                <div class="weather-card">
                    <div class="card-label">오후 (15시)</div>
                    <div class="card-icon">
                        <img id="tomorrow-pm-icon" src="https://openweathermap.org/img/wn/04d@2x.png" alt="내일 오후">
                    </div>
                    <div class="card-temp-sub">
                        <span class="min-temp" id="tomorrow-pm-min">--°</span> / 
                        <span class="max-temp" id="tomorrow-pm-max">--°</span>
                    </div>
                    <div class="card-info-badge">☔ 강수확률 <span id="tomorrow-pm-pop">--%</span></div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const MY_API_KEY = 'a97c0cd9e895f21fc9caa030137a6632';

    function getKoreanDay(date) {
        const week = ['일', '월', '화', '수', '목', '금', '토'];
        return week[date.getDay()];
    }

    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        
        document.getElementById('current-time').innerText = `${hours}:${minutes}:${seconds}`;
        
        const todayStr = `${now.getMonth() + 1}월 ${now.getDate()}일 (${getKoreanDay(now)})`;
        document.getElementById('current-date').innerText = todayStr;
    }

    function weatherKor(main){
        const map = {
            "Clear": "맑음",
            "Clouds": "구름 많음",
            "Rain": "비",
            "Drizzle": "이슬비",
            "Thunderstorm": "천둥번개",
            "Snow": "눈",
            "Mist": "안개",
            "Fog": "안개",
            "Haze": "연무"
        };
        return map[main] || main;
    }

    async function fetchWeather(){
        // 창원NC파크 기준 GPS 좌표
        const LAT = '35.2227';
        const LON = '128.5812';

        const currentUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${LAT}&lon=${LON}&appid=${MY_API_KEY}&units=metric`;
        const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${LAT}&lon=${LON}&appid=${MY_API_KEY}&units=metric`;

        try {
            const currentRes = await fetch(currentUrl);
            const currentData = await currentRes.json();

            document.getElementById('current-icon').src = `https://openweathermap.org/img/wn/${currentData.weather[0].icon}@4x.png`;
            document.getElementById('weather-status').innerText = weatherKor(currentData.weather[0].main);
            document.getElementById('current-temp').innerText = Math.round(currentData.main.temp) + "°";
            document.getElementById('feels-temp').innerText = Math.round(currentData.main.feels_like) + "°";
            document.getElementById('humidity').innerText = currentData.main.humidity + "%";

            const now = new Date();
            document.getElementById('current-update').innerText = `(${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} 갱신)`;

            const forecastRes = await fetch(forecastUrl);
            const forecastData = await forecastRes.json();

            const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            const todaysForecasts = forecastData.list.filter(item => item.dt_txt.startsWith(todayStr));
            
            let todayMin = currentData.main.temp_min; 
            let todayMax = currentData.main.temp_max;

            if (todaysForecasts.length > 0) {
                const temps = todaysForecasts.map(item => item.main.temp);
                temps.push(currentData.main.temp); 
                todayMin = Math.min(...temps);
                todayMax = Math.max(...temps);
            }
            document.getElementById('today-min').innerText = Math.round(todayMin) + "°";
            document.getElementById('today-max').innerText = Math.round(todayMax) + "°";

            const tomorrow = new Date(Date.now() + 86400000);
            const dateStr = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth()+1).padStart(2,'0')}-${String(tomorrow.getDate()).padStart(2,'0')}`;
            
            const tomorrowStr = `(${tomorrow.getMonth() + 1}월 ${tomorrow.getDate()}일)`;
            document.getElementById('tomorrow-date').innerText = tomorrowStr;

            const tomorrowsForecasts = forecastData.list.filter(item => item.dt_txt.startsWith(dateStr));

            const amForecasts = tomorrowsForecasts.filter(item => {
                const hour = parseInt(item.dt_txt.split(' ')[1].split(':')[0], 10);
                return hour <= 12;
            });
            const pmForecasts = tomorrowsForecasts.filter(item => {
                const hour = parseInt(item.dt_txt.split(' ')[1].split(':')[0], 10);
                return hour > 12;
            });

            const am = forecastData.list.find(x => x.dt_txt === `${dateStr} 09:00:00`);
            const pm = forecastData.list.find(x => x.dt_txt === `${dateStr} 15:00:00`);

            if (am) {
                document.getElementById('tomorrow-am-icon').src = `https://openweathermap.org/img/wn/${am.weather[0].icon}@2x.png`;
                document.getElementById('tomorrow-am-pop').innerText = Math.round(am.pop * 100) + "%";
                
                if (amForecasts.length > 0) {
                    const amTemps = amForecasts.map(item => item.main.temp);
                    document.getElementById('tomorrow-am-min').innerText = Math.round(Math.min(...amTemps)) + "°";
                    document.getElementById('tomorrow-am-max').innerText = Math.round(Math.max(...amTemps)) + "°";
                } else {
                    document.getElementById('tomorrow-am-min').innerText = Math.round(am.main.temp_min) + "°";
                    document.getElementById('tomorrow-am-max').innerText = Math.round(am.main.temp_max) + "°";
                }
            }

            if (pm) {
                document.getElementById('tomorrow-pm-icon').src = `https://openweathermap.org/img/wn/${pm.weather[0].icon}@2x.png`;
                document.getElementById('tomorrow-pm-pop').innerText = Math.round(pm.pop * 100) + "%";

                if (pmForecasts.length > 0) {
                    const pmTemps = pmForecasts.map(item => item.main.temp);
                    document.getElementById('tomorrow-pm-min').innerText = Math.round(Math.min(...pmTemps)) + "°";
                    document.getElementById('tomorrow-pm-max').innerText = Math.round(Math.max(...pmTemps)) + "°";
                } else {
                    document.getElementById('tomorrow-pm-min').innerText = Math.round(pm.main.temp_min) + "°";
                    document.getElementById('tomorrow-pm-max').innerText = Math.round(pm.main.temp_max) + "°";
                }
            }

        } catch (e) {
            console.log(e);
            document.getElementById('current-update').innerText = "(연결 대기)";
        }
    }

    updateClock();
    setInterval(updateClock, 1000); 

    fetchWeather();
    setInterval(fetchWeather, 60000); 
</script>

</body>
</html>
