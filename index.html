<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>창원 양덕동 실시간 날씨 TV</title>


<style>


* {
    box-sizing:border-box;
}


body {

    font-family:'Malgun Gothic',
                 'Apple SD Gothic Neo',
                 sans-serif;

    background:linear-gradient(135deg,#1e375a,#2980b9);

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

    margin:0;

    overflow:hidden;

}



.weather-container {

    background:rgba(255,255,255,0.98);

    width:95%;

    height:85vh;

    padding:20px 35px;

    border-radius:30px;

    box-shadow:0 25px 60px rgba(0,0,0,0.4);

    display:flex;

    align-items:center;

    justify-content:space-around;

}



/* =====================
   현재 날씨
===================== */


.current-weather {

    flex:1.2;

    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    border-right:3px solid #e2e8f0;

    padding-right:25px;

}



.location-title {

    margin:0 0 5px;

    font-size:3rem;

    color:#1e375a;

    font-weight:bold;

    white-space:nowrap;

}



.weather-icon-box img {

    width:200px;

    height:200px;

    filter:drop-shadow(0 8px 15px rgba(0,0,0,0.2));

}



.weather-status {

    font-size:2rem;

    font-weight:bold;

    color:#2c3e50;

    margin-top:-5px;

}




.current-detail {

    margin-top:5px;

    display:flex;

    flex-direction:column;

    gap:5px;

    font-size:1.8rem;

    font-weight:bold;

    color:#34495e;

}



.current-temp {

    font-size:4rem;

    color:#e74c3c;

    line-height:1.1;

}




.update-info {

    margin-top:10px;

    font-size:1.5rem;

    font-weight:bold;

    color:#7f8c8d;

}





/* =====================
   내일 예보
===================== */


.tomorrow-weather {

    flex:2;

    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    padding-left:30px;

}



.tomorrow-title {

    margin:0 0 15px;

    font-size:2.5rem;

    color:#2c3e50;

    white-space:nowrap;

}



.forecast-grid {

    width:100%;

    display:flex;

    gap:30px;

}



.forecast-item {

    flex:1;

    background:#f8fafc;

    border:2px solid #e2e8f0;

    border-radius:20px;

    padding:25px 20px;

    text-align:center;

}



.time-slot {

    font-size:2rem;

    font-weight:bold;

}



.small-icon img {

    width:130px;

    height:130px;

}



.temp-range {

    font-size:2.5rem;

    font-weight:bold;

}



.min-temp {

    color:#3498db;

}



.max-temp {

    color:#e74c3c;

}


</style>

</head>


<body>


<div class="weather-container">



<!-- 현재 날씨 -->


<div class="current-weather">


<h1 class="location-title">
📍 창원 양덕동
</h1>



<div class="weather-icon-box">

<img id="current-icon"
src="https://openweathermap.org/img/wn/01d@4x.png">

</div>



<div class="weather-status" id="weather-status">
날씨 확인 중...
</div>




<div class="current-detail">


<div class="current-temp" id="current-temp">
--°
</div>


<div>
🌡 체감온도 
<span id="feels-temp">--°</span>
</div>


<div>
💧 습도 
<span id="humidity">--%</span>
</div>


</div>



<div class="update-info" id="current-update">
날씨 연결 시도 중...
</div>



</div>





<!-- 내일 예보 -->


<div class="tomorrow-weather">


<h2 class="tomorrow-title">
🔮 내일 날씨 예보
</h2>



<div class="forecast-grid">



<div class="forecast-item">


<div class="time-slot">
오전 (09시)
</div>



<div class="small-icon">

<img id="tomorrow-am-icon"
src="https://openweathermap.org/img/wn/02d@2x.png">

</div>



<div class="temp-range">

<span class="min-temp" id="tomorrow-am-min">
--°
</span>

/

<span class="max-temp" id="tomorrow-am-max">
--°
</span>


</div>



</div>





<div class="forecast-item">


<div class="time-slot">
오후 (15시)
</div>



<div class="small-icon">

<img id="tomorrow-pm-icon"
src="https://openweathermap.org/img/wn/04d@2x.png">

</div>



<div class="temp-range">

<span class="min-temp" id="tomorrow-pm-min">
--°
</span>

/

<span class="max-temp" id="tomorrow-pm-max">
--°
</span>


</div>



</div>



</div>


</div>



</div>





<script>


const MY_API_KEY =
'a97c0cd9e895f21fc9caa030137a6632';



function weatherKor(main){


const map={


"Clear":"맑음",

"Clouds":"구름 많음",

"Rain":"비",

"Drizzle":"이슬비",

"Thunderstorm":"천둥번개",

"Snow":"눈",

"Mist":"안개",

"Fog":"안개",

"Haze":"연무"


};


return map[main] || main;


}





async function fetchWeather(){


const LAT='35.2255';

const LON='128.5847';



const currentUrl =

`https://api.openweathermap.org/data/2.5/weather?lat=${LAT}&lon=${LON}&appid=${MY_API_KEY}&units=metric`;



const forecastUrl =

`https://api.openweathermap.org/data/2.5/forecast?lat=${LAT}&lon=${LON}&appid=${MY_API_KEY}&units=metric`;



try{


// 현재 날씨


const currentRes =
await fetch(currentUrl);


const currentData =
await currentRes.json();




document.getElementById('current-icon').src =

`https://openweathermap.org/img/wn/${currentData.weather[0].icon}@4x.png`;




document.getElementById('weather-status').innerText =

weatherKor(currentData.weather[0].main);




document.getElementById('current-temp').innerText =

Math.round(currentData.main.temp)+"°";



document.getElementById('feels-temp').innerText =

Math.round(currentData.main.feels_like)+"°";



document.getElementById('humidity').innerText =

currentData.main.humidity+"%";






const now=new Date();


document.getElementById('current-update').innerText =

`최근 갱신 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;







// 예보


const forecastRes =
await fetch(forecastUrl);


const forecastData =
await forecastRes.json();





const tomorrow =
new Date(Date.now()+86400000);



const date =

`${tomorrow.getFullYear()}-${String(tomorrow.getMonth()+1).padStart(2,'0')}-${String(tomorrow.getDate()).padStart(2,'0')}`;





const am = forecastData.list.find(x =>

x.dt_txt === `${date} 09:00:00`

);



const pm = forecastData.list.find(x =>

x.dt_txt === `${date} 15:00:00`

);






if(am){


document.getElementById('tomorrow-am-icon').src =

`https://openweathermap.org/img/wn/${am.weather[0].icon}@2x.png`;



document.getElementById('tomorrow-am-min').innerText =

Math.round(am.main.temp_min)+"°";



document.getElementById('tomorrow-am-max').innerText =

Math.round(am.main.temp_max)+"°";


}




if(pm){


document.getElementById('tomorrow-pm-icon').src =

`https://openweathermap.org/img/wn/${pm.weather[0].icon}@2x.png`;



document.getElementById('tomorrow-pm-min').innerText =

Math.round(pm.main.temp_min)+"°";



document.getElementById('tomorrow-pm-max').innerText =

Math.round(pm.main.temp_max)+"°";


}



}

catch(e){

console.log(e);

document.getElementById('current-update').innerText =
"통신 연결 대기 중...";

}



}



fetchWeather();


setInterval(fetchWeather,60000);



</script>


</body>
</html>
