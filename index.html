<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창원시 양덕동 대형 실시간 날씨 (TV용)</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #1e375a, #2980b9); 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* 스크롤바 방지 */
        }
        
        .weather-container {
            background: rgba(255, 255, 255, 0.98);
            width: 95%;
            height: 90vh; /* 화면을 더 넓게 쓰도록 높이 확장 */
            padding: 25px 35px;
            border-radius: 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        /* =====================
           현재 날씨 (왼쪽 영역)
        ===================== */
        .current-weather {
            flex: 1.2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-right: 3px solid #e2e8f0;
            padding-right: 25px;
        }

        .location-title {
            margin: 0 0 5px;
            font-size: 3.2rem;
            color: #1e375a;
            font-weight: bold;
            white-space: nowrap;
        }

        /* 오늘 날짜 스타일 추가 */
        .current-date {
            font-size: 1.8rem;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 5px;
        }

        .weather-icon-box img {
            width: 220px;
            height: 220px;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.2));
        }

        .weather-status {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-top: -10px;
            margin-bottom: 5px;
        }

        .current-detail {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #34495e;
        }

        .current-temp {
            font-size: 4.5rem;
            color: #e74c3c;
            line-height: 1.1;
            font-weight: 900;
        }

        .today-range {
            font-size: 1.8rem;
            margin-bottom: 3px;
        }

        .update-info {
            margin-top: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #7f8c8d;
        }

        /* =====================
           내일 예보 (오른쪽 영역)
        ===================== */
        .tomorrow-weather {
            flex: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-left: 35px;
        }

        .tomorrow-title-box {
            text-align: center;
            margin-bottom: 20px;
        }

        .tomorrow-title {
            margin: 0;
            font-size: 2.8rem;
            color: #2c3e50;
            font-weight: bold;
            white-space: nowrap;
        }

        /* 내일 날짜 스타일 추가 */
        .tomorrow-date {
            font-size: 1.8rem;
            color: #7f8c8d;
            font-weight: bold;
            margin-top: 5px;
        }

        .forecast-grid {
            width: 100%;
            display: flex;
            gap: 30px;
        }

        .forecast-item {
            flex: 1;
            background: #f8fafc;
            border: 2.5px solid #e2e8f0;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
        }

        .time-slot {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .small-icon img {
            width: 140px;
            height: 140px;
        }

        .temp-range {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .pop-info {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2980b9;
            background: #eef2f7;
            padding: 6px 15px;
            border-radius: 12px;
            display: inline-block;
        }

        .min-temp {
            color: #3498db;
        }

        .max-temp {
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="weather-container">

    <!-- 왼쪽: 현재 및 오늘 날씨 -->
    <div class="current-weather">
        <h1 class="location-title">📍 창원 양덕동</h1>
        <!-- 오늘 날짜 영역 -->
        <div class="current-date" id="current-date">00월 00일 (요일)</div>

        <div class="weather-icon-box">
            <img id="current-icon" src="https://openweathermap.org/img/wn/01d@4x.png" alt="현재 날씨">
        </div>

        <div class="weather-status" id="weather-status">날씨 확인 중...</div>

        <div class="current-detail">
            <!-- 실시간 기온 -->
            <div class="current-temp" id="current-temp">--°</div>
            <!-- 오늘 최저 / 최고 온도 -->
            <div class="today-range">
                <span class="min-temp" id="today-min">--°</span> / 
                <span class="max-temp" id="today-max">--°</span>
            </div>
            <div>🌡 체감 <span id="feels-temp">--°</span></div>
            <div>💧 습도 <span id="humidity">--%</span></div>
        </div>

        <div class="update-info" id="current-update">날씨 연결 시도 중...</div>
    </div>

    <!-- 오른쪽: 내일 날씨 예보 -->
    <div class="tomorrow-weather">
        <div class="tomorrow-title-box">
            <h2 class="tomorrow-title">🔮 내일 날씨 예보</h2>
            <!-- 내일 날짜 영역 -->
            <div class="tomorrow-date" id="tomorrow-date">00월 00일 (요일)</div>
        </div>

        <div class="forecast-grid">
            <!-- 내일 오전 -->
            <div class="forecast-item">
                <div class="time-slot">오전 (09시)</div>
                <div class="small-icon">
                    <img id="tomorrow-am-icon" src="https://openweathermap.org/img/wn/02d@2x.png" alt="내일 오전">
                </div>
                <div class="temp-range">
                    <span class="min-temp" id="tomorrow-am-min">--°</span> / 
                    <span class="max-temp" id="tomorrow-am-max">--°</span>
                </div>
                <!-- 강수 확률 -->
                <div class="pop-info">☔ 강수확률 <span id="tomorrow-am-pop">--%</span></div>
            </div>

            <!-- 내일 오후 -->
            <div class="forecast-item">
                <div class="time-slot">오후 (15시)</div>
                <div class="small-icon">
                    <img id="tomorrow-pm-icon" src="https://openweathermap.org/img/wn/04d@2x.png" alt="내일 오후">
                </div>
                <div class="temp-range">
                    <span class="min-temp" id="tomorrow-pm-min">--°</span> / 
                    <span class="max-temp" id="tomorrow-pm-max">--°</span>
                </div>
                <!-- 강수 확률 -->
                <div class="pop-info">☔ 강수확률 <span id="tomorrow-pm-pop">--%</span></div>
            </div>
        </div>
    </div>

</div>

<script>
    const MY_API_KEY = 'a97c0cd9e895f21fc9caa030137a6632';

    // 한글 요일 변환 함수
    function getKoreanDay(date) {
        const week = ['일', '월', '화', '수', '목', '금', '토'];
        return week[date.getDay()];
    }

    function weatherKor(main){
        const map = {
            "Clear": "맑음",
            "Clouds": "구름 많음",
            "Rain": "비",
            "Drizzle": "이슬비",
            "Thunderstorm": "천둥번개",
            "Snow": "눈",
            "Mist": "안개",
            "Fog": "안개",
            "Haze": "연무"
        };
        return map[main] || main;
    }

    async function fetchWeather(){
        const LAT = '35.2255';
        const LON = '128.5847';

        const currentUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${LAT}&lon=${LON}&appid=${MY_API_KEY}&units=metric`;
        const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${LAT}&lon=${LON}&appid=${MY_API_KEY}&units=metric`;

        try {
            // 1. 현재 날씨 가져오기
            const currentRes = await fetch(currentUrl);
            const currentData = await currentRes.json();

            document.getElementById('current-icon').src = `https://openweathermap.org/img/wn/${currentData.weather[0].icon}@4x.png`;
            document.getElementById('weather-status').innerText = weatherKor(currentData.weather[0].main);
            document.getElementById('current-temp').innerText = Math.round(currentData.main.temp) + "°";
            document.getElementById('today-min').innerText = Math.round(currentData.main.temp_min) + "°";
            document.getElementById('today-max').innerText = Math.round(currentData.main.temp_max) + "°";
            document.getElementById('feels-temp').innerText = Math.round(currentData.main.feels_like) + "°";
            document.getElementById('humidity').innerText = currentData.main.humidity + "%";

            // 날짜 표시 업데이트 (오늘)
            const now = new Date();
            const todayStr = `${now.getMonth() + 1}월 ${now.getDate()}일 (${getKoreanDay(now)})`;
            document.getElementById('current-date').innerText = todayStr;

            // 업데이트 갱신 시각 업데이트
            document.getElementById('current-update').innerText = `최근 갱신 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

            // 2. 예보 가져오기
            const forecastRes = await fetch(forecastUrl);
            const forecastData = await forecastRes.json();

            const tomorrow = new Date(Date.now() + 86400000);
            const dateStr = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth()+1).padStart(2,'0')}-${String(tomorrow.getDate()).padStart(2,'0')}`;
            
            // 날짜 표시 업데이트 (내일)
            const tomorrowStr = `${tomorrow.getMonth() + 1}월 ${tomorrow.getDate()}일 (${getKoreanDay(tomorrow)})`;
            document.getElementById('tomorrow-date').innerText = tomorrowStr;

            const am = forecastData.list.find(x => x.dt_txt === `${dateStr} 09:00:00`);
            const pm = forecastData.list.find(x => x.dt_txt === `${dateStr} 15:00:00`);

            if (am) {
                document.getElementById('tomorrow-am-icon').src = `https://openweathermap.org/img/wn/${am.weather[0].icon}@2x.png`;
                document.getElementById('tomorrow-am-min').innerText = Math.round(am.main.temp_min) + "°";
                document.getElementById('tomorrow-am-max').innerText = Math.round(am.main.temp_max) + "°";
                // 강수 확률 표시 (POP 데이터는 0~1 범위이므로 100을 곱해 %로 만듭니다)
                document.getElementById('tomorrow-am-pop').innerText = Math.round(am.pop * 100) + "%";
            }

            if (pm) {
                document.getElementById('tomorrow-pm-icon').src = `https://openweathermap.org/img/wn/${pm.weather[0].icon}@2x.png`;
                document.getElementById('tomorrow-pm-min').innerText = Math.round(pm.main.temp_min) + "°";
                document.getElementById('tomorrow-pm-max').innerText = Math.round(pm.main.temp_max) + "°";
                // 강수 확률 표시
                document.getElementById('tomorrow-pm-pop').innerText = Math.round(pm.pop * 100) + "%";
            }

        } catch (e) {
            console.log(e);
            document.getElementById('current-update').innerText = "통신 연결 대기 중...";
        }
    }

    fetchWeather();
    setInterval(fetchWeather, 60000);
</script>

</body>
</html>
